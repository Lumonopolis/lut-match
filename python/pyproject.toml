[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lut-match"
version = "0.1.0"
description = "Reference-still to smooth .cube 3D color-grade LUT solver"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
lut-match = "lut_match.cli:main"

[project.urls]
Homepage = "https://github.com/Lumonopolis/lut-match"
Repository = "https://github.com/Lumonopolis/lut-match"

[tool.setuptools.packages.find]
where = ["."]
include = ["lut_match*"]
