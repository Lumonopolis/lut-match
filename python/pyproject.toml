[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lut-match"
version = "0.1.0"
description = "Fit smooth, zero-inversion .cube 3D LUTs and HaldCLUT PNGs from reference stills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["color-grading", "3d-lut", "cube", "haldclut", "oklab", "davinci-resolve", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
lut-match = "lut_match.cli:main"

[project.urls]
Homepage = "https://lumonopolis.github.io/lut-match/"
Repository = "https://github.com/Lumonopolis/lut-match"

[tool.setuptools.packages.find]
where = ["."]
include = ["lut_match*"]
