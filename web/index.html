        <p>
          <strong>lut-match</strong> (MIT) fits Adobe <code>.cube</code> 3D LUTs (17&sup3;, 33&sup3;, 65&sup3;) and
          Level-8 HaldCLUT PNGs from one or more unrelated reference stills — 100% locally in WebGL2, TypeScript, and
          Python, with zero neural weights and 0.00% monotonicity inversions in sRGB/Rec.709 working space.
        </p>
        <ul>
          <li><strong>Install Python CLI:</strong> <code>pip install lut-match</code></li>
          <li><strong>Install TypeScript core:</strong> <code>npm install lut-match-core</code></li>
          <li><strong>Supported IDTs:</strong> sRGB / Rec.709 (Resolve CST), Apple Log, Sony S-Log3, Panasonic V-Log, Canon C-Log3</li>
