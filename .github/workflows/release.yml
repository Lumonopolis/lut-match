name: Release to PyPI & npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python sdist & wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build python --outdir dist-py
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-py

  publish-npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: npm install -g npm@latest
      - name: Build, test & publish lut-match-core
        working-directory: packages/lut-match-core
        run: |
          npm install
          npm run build
          npm test
          npm publish --access public
